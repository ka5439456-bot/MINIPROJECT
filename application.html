    <div class="form-container">
    <h2>Contact Form</h2>

<form>
        <div class="form-group">
            <label>Name</label>
            <input type="text" placeholder="Enter name" id="fst">
            <p id="lab1"></p>
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" placeholder="Enter location" id="sec">
             <p id="lab2"></p>
        </div>

        <div class="form-group">
            <label>Course</label>
            <input type="text" placeholder="Enter course" id="thr">
             <p id="lab3"></p>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter email" id="fou">
             <p id="lab4"></p>
        </div>

        <div class="form-group">
            <label>Contact No</label>
            <input type="text" placeholder="Enter number"id="fiv">
             <p id="lab5"></p>
        </div>

        <button type="button" onclick="check()">Submit</button>
    </form>

    <script>
         let pat = /^[a-zA-Z]+$/
        let pat2 = /^[A-Za-z]+$/
        let pat3 = /^[a-zA-Z]+$/
        let pat4 = /^[a-z0-9]+@[a-z]+\.[a-z]+$/
        let pat5=/^[0-9]+$/
    function check() {
        let a= document.getElementById("fst").value;
        if (a==""){
            document.getElementById("lab1").innerHTML="empty"
            document.getElementById("lab1").style.color = "red"

        }
        else if (!pat.test(a)) {
                    document.getElementById("lab1").innerHTML = "not valid"
        }
        else{
            document.getElementById("lab1").innerText="okay"
             document.getElementById("lab1").style.color="black"
        }

        let b=document.getElementById("sec").value;
        if (b==""){
            document.getElementById("lab2").innerHTML="empty"
             document.getElementById("lab2").style.color="red"
        }
        else if (!pat2.test(b)) {
                        document.getElementById("lab2").innerHTML = "not valid"
                         document.getElementById("lab2").style.color="red"
        }
        else{
            document.getElementById("lab2").innerHTML="okay"
             document.getElementById("lab2").style.color="black"
        }

        let c= document.getElementById("thr").value;
        if (a==""){
            document.getElementById("lab3").innerHTML="empty";
             document.getElementById("lab3").style.color="red"
        }
        else if (!pat.test(c)){
            document.getElementById("lab3").innerHTML="not valid"
            document.getElementById("lab3").style.color="red"
        }
        else{
            document.getElementById("lab3").innerHTML="okay"
             document.getElementById("lab3").style.color="black"
        }

        let d=document.getElementById("fou").value;
        if (d==""){
            document.getElementById("lab4").innerHTML="empty"
             document.getElementById("lab4").style.color="red"
        }
        else if(!pat4.test(d)){
            document.getElementById("lab4").innerHTML="notvalid"
             document.getElementById("lab4").style.color="red"
        }
        else{
             document.getElementById("lab4").innerHTML="okay"
              document.getElementById("lab4").style.color="black"
        }

        let e= document.getElementById("fiv").value
        if (e==""){
            document.getElementById("lab5").innerHTML="empty"
             document.getElementById("lab5").style.color="red"
        }
        else if(!pat5.test(e)){
             document.getElementById("lab5").innerHTML="notvalid"
              document.getElementById("lab4").style.color="red"
        }
        else{
            document.getElementById("lab5").innerText="okay"
            document.getElementById("lab5").style.color="black"
        }
    }
